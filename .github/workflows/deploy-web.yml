name: deploy web
on:
  push:
    branches: [main]
    paths: [web/**, docker-compose.yml, .github/workflows/deploy-web.yml]
# api and web share one docker compose on the server: never run two deploys at once
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/burchmotorsport
            git pull --ff-only
            docker compose up -d --build web
            docker image prune -f
