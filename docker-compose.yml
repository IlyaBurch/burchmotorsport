services:
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - caddy_data:/data
    depends_on:
      - api

  api:
    build: ./api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080" # local dev: vite proxies /api here

volumes:
  caddy_data:
